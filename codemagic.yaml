workflows:
  android:
    name: HexNext Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: false
        - pattern: master
          include: true
          source: false
        - pattern: "release/**"
          include: true
          source: false
      cancel_previous_builds: true
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - name: Test release tooling
        script: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install Android SDK packages
        script: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Test, lint, and build universal APKs
        script: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            :app:verifyAndroidSdkTools :app:testPlayDebugUnitTest \
            :app:lintPlayRelease :app:assemblePlayDebug :app:assemblePlayRelease \
            :app:assembleOwnerRelease
          ./gradlew --no-daemon --console=plain :app:bundlePlayRelease
        test_report: android/app/build/test-results/testPlayDebugUnitTest/*.xml
      - name: Verify unsigned universal release candidate
        script: |
          set -euo pipefail
          python3 bin/verify-release-apk.py \
            android/app/build/outputs/apk/play/release/app-play-universal-release-unsigned.apk \
            --unsigned
    artifacts:
      - android/app/build/outputs/apk/play/debug/app-play-universal-debug.apk
      - android/app/build/outputs/apk/play/release/app-play-universal-release-unsigned.apk
      - android/app/build/outputs/mapping/playRelease/mapping.txt
      - android/app/build/reports/lint-results-playRelease.html
      - android/app/build/outputs/bundle/playRelease/*.aab
