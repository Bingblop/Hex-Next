name: Android Universal APK

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      # Run once from the default branch to create the cached debug-keystore pin (see below).
      # Only a run started with this set may save a key it generated, so an evicted pin is never
      # replaced silently by an ordinary push.
      bootstrap_debug_keystore:
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      # Set by a caller (release.yml passes the release tag). When called, github.workflow and
      # github.ref belong to the caller, so without this key two release dispatches from the same
      # branch would share one group and the newer validation would cancel the older one.
      concurrency_key:
        type: string
        required: false
        default: ""
    secrets:
      # Called workflows only see secrets the caller passes in; release.yml passes this one.
      HEXNEXT_DEBUG_KEYSTORE_BASE64:
        required: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ inputs.concurrency_key || github.ref }}
  cancel-in-progress: ${{ !inputs.concurrency_key && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Unit tests for the release tooling in bin/ (prepare-release.py, verify-release-apk.py).
  test-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  build-android:
    runs-on: ubuntu-latest
    env:
      HEXNEXT_HAS_DEBUG_KEYSTORE_SECRET: ${{ secrets.HEXNEXT_DEBUG_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install SDK 36 and build-tools 36.0.0
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Test builds must keep one debug certificate across runs, or `pm install -r` over another
      # run's build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE and the tester has to uninstall
      # (losing themes, packs, keys and settings). AGP signs debug builds with
      # ~/.android/debug.keystore, so pin it. The HEXNEXT_DEBUG_KEYSTORE_BASE64 secret (store/key
      # password "android", alias "androiddebugkey") is the only durable pin. Without it the
      # keystore lives in the Actions cache, which GitHub evicts (7 days unread, or LRU over the
      # quota) and scopes per ref, so: only a manual bootstrap run on the default branch
      # (workflow_dispatch with bootstrap_debug_keystore) may create the cached pin (every ref can
      # read it), and tools/device/debug-keystore.sha256, once it holds the
      # pinned certificate's SHA-256, fails the build when the keystore in use differs instead of
      # silently shipping a build that cannot update over the installed one.
      - name: Restore pinned debug keystore from cache
        id: debug-keystore-cache
        if: env.HEXNEXT_HAS_DEBUG_KEYSTORE_SECRET != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: hexnext-debug-keystore-v1
      - name: Restore pinned debug keystore from secret
        if: env.HEXNEXT_HAS_DEBUG_KEYSTORE_SECRET == 'true'
        env:
          HEXNEXT_DEBUG_KEYSTORE_BASE64: ${{ secrets.HEXNEXT_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          printf '%s' "$HEXNEXT_DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          chmod 600 ~/.android/debug.keystore
      # A newly generated key also fails the run at its end ("Fail when the debug build ...") and is
      # never cached outside a bootstrap run, so an evicted pin keeps every build red, even while
      # debug-keystore.sha256 is still empty, until the secret is set or a bootstrap run re-pins.
      - name: Check debug keystore against the pinned certificate
        id: debug-keystore-check
        run: |
          set -euo pipefail
          if [ ! -f ~/.android/debug.keystore ]; then
            echo "::warning::No pinned debug keystore (cache miss and no HEXNEXT_DEBUG_KEYSTORE_BASE64 secret); generating a new one. Its builds will not update over builds signed with an earlier key."
            echo "generated=true" >> "$GITHUB_OUTPUT"
            mkdir -p ~/.android
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android \
              -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          actual=$(keytool -list -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n 1)
          echo "Debug certificate SHA-256: $actual"
          expected=$(grep -v '^#' ../tools/device/debug-keystore.sha256 | tr -d '[:space:]' || true)
          if [ -z "$expected" ]; then
            echo "::warning::tools/device/debug-keystore.sha256 is empty, so a replaced debug key would go unnoticed. Commit this certificate's SHA-256 there: $actual"
          elif [ "$actual" != "$expected" ]; then
            echo "::error::The debug keystore's certificate ($actual) is not the pinned one ($expected). The cached pin was probably evicted; set the HEXNEXT_DEBUG_KEYSTORE_BASE64 secret to the original debug.keystore, or update tools/device/debug-keystore.sha256 if the key change is intended (testers must then uninstall once)."
            exit 1
          fi
      # Only a deliberate bootstrap run on the default branch caches a key generated in this run.
      # PR and release/** refs never save a pin the default branch cannot see, and an ordinary push
      # after an eviction does not quietly turn its new key into the pin (its run fails below).
      - name: Save pinned debug keystore to cache
        if: >-
          env.HEXNEXT_HAS_DEBUG_KEYSTORE_SECRET != 'true'
          && steps.debug-keystore-cache.outputs.cache-hit != 'true'
          && steps.debug-keystore-check.outputs.generated == 'true'
          && github.event_name == 'workflow_dispatch'
          && inputs.bootstrap_debug_keystore == true
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: hexnext-debug-keystore-v1
      # Debug builds carry a few small packs from the `packs` branch (history-free pack hosting),
      # so the test build can theme Settings icons on a private repo without a catalogue download.
      # Release builds never bundle packs (they come from the entitlement server).
      - name: Bundle test packs into the debug build
        run: |
          set -euo pipefail
          git fetch --depth 1 origin packs
          mkdir -p app/src/debug/assets/packs
          for pack in velvet-rope particle-zoo firefly stardust; do
            git show "origin/packs:$pack.zip" > "app/src/debug/assets/packs/$pack.zip"
          done
          ls -l app/src/debug/assets/packs
      - name: Test and build unsigned universal candidate
        run: ./gradlew --no-daemon --console=plain :engine:test :app:verifyAndroidSdkTools :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug
      - name: Verify installable universal candidate
        run: |
          python3 ../bin/verify-release-apk.py \
            app/build/outputs/apk/release/app-universal-release-unsigned.apk --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: HexNext-Universal-Unsigned-Candidate
          path: |
            android/app/build/outputs/apk/release/app-universal-release-unsigned.apk
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error

      - name: Upload installable debug-signed test build
        uses: actions/upload-artifact@v4
        with:
          name: HexNext-Debug-Test-Installable
          path: android/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error

      - name: Exercise signed release path with an ephemeral CI-only key
        env:
          HEXNEXT_STORE_PASSWORD: ci-test-only
          HEXNEXT_KEY_ALIAS: ci-test
          HEXNEXT_KEY_PASSWORD: ci-test-only
        run: |
          set -euo pipefail
          export HEXNEXT_KEYSTORE_PATH="$RUNNER_TEMP/hexnext-ci-test.keystore"
          trap 'rm -f "$HEXNEXT_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$HEXNEXT_KEYSTORE_PATH" \
            -storepass:env HEXNEXT_STORE_PASSWORD -keypass:env HEXNEXT_KEY_PASSWORD \
            -alias "$HEXNEXT_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=HexNext CI Test"
          ../bin/build-and-sign-release-apk.sh "$RUNNER_TEMP/HexNext-ci-test.apk"

      # Last, so the artifacts above are still uploaded: a debug build signed with a key generated
      # in this run cannot update over any installed test build and is not cached, so the next run
      # signs with yet another key. Fail instead of passing with only a warning.
      # A release validation (workflow_call with concurrency_key) is not blocked by the debug key,
      # and a bootstrap run on the default branch passes because it just cached its key as the pin.
      - name: Fail when the debug build was signed with a new, unpinned key
        if: >-
          steps.debug-keystore-check.outputs.generated == 'true'
          && !inputs.concurrency_key
          && !(inputs.bootstrap_debug_keystore == true
            && github.event_name == 'workflow_dispatch'
            && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
        run: |
          # Until the first pin exists (tools/device/debug-keystore.sha256 still empty, as on the PR
          # branch before the default-branch bootstrap) there is nothing to drift from: warn only.
          if [ -z "$(grep -v '^#' ../tools/device/debug-keystore.sha256 | tr -d '[:space:]' || true)" ]; then
            echo "::warning::No debug keystore pin exists yet, so this test build has its own key and testers must uninstall before installing it. After merging, run this workflow on the default branch with bootstrap_debug_keystore and commit the certificate SHA-256 to tools/device/debug-keystore.sha256."
            exit 0
          fi
          echo "::error::This run's debug build is signed with a newly generated key (no HEXNEXT_DEBUG_KEYSTORE_BASE64 secret and no cached pin), so it will not install over earlier test builds. Set the secret to the original debug.keystore, or (no key worth keeping yet) run this workflow on the default branch with bootstrap_debug_keystore, then commit the certificate SHA-256 to tools/device/debug-keystore.sha256 and pin that run in tools/device/install.sh."
          exit 1
