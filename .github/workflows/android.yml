name: Android Universal APK

on:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check server.js && node --test tests/*.test.js
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install SDK 36 and build-tools 36.0.0
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test and build unsigned universal candidate
        run: ./gradlew --no-daemon --console=plain :app:verifyAndroidSdkTools :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify installable universal candidate
        run: |
          python3 ../bin/verify-release-apk.py \
            app/build/outputs/apk/release/app-universal-release-unsigned.apk --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: HexNext-Universal-Unsigned-Candidate
          path: |
            android/app/build/outputs/apk/release/app-universal-release-unsigned.apk
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error

      - name: Exercise signed release path with an ephemeral CI-only key
        env:
          HEXNEXT_STORE_PASSWORD: ci-test-only
          HEXNEXT_KEY_ALIAS: ci-test
          HEXNEXT_KEY_PASSWORD: ci-test-only
        run: |
          set -euo pipefail
          export HEXNEXT_KEYSTORE_PATH="$RUNNER_TEMP/hexnext-ci-test.keystore"
          trap 'rm -f "$HEXNEXT_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$HEXNEXT_KEYSTORE_PATH" \
            -storepass:env HEXNEXT_STORE_PASSWORD -keypass:env HEXNEXT_KEY_PASSWORD \
            -alias "$HEXNEXT_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=HexNext CI Test"
          ../bin/build-and-sign-release-apk.sh "$RUNNER_TEMP/HexNext-ci-test.apk"

  signed-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-web, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify production-signed universal APK
        env:
          HEXNEXT_KEYSTORE_BASE64: ${{ secrets.HEXNEXT_KEYSTORE_BASE64 }}
          HEXNEXT_STORE_PASSWORD: ${{ secrets.HEXNEXT_STORE_PASSWORD }}
          HEXNEXT_KEY_ALIAS: ${{ secrets.HEXNEXT_KEY_ALIAS }}
          HEXNEXT_KEY_PASSWORD: ${{ secrets.HEXNEXT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${HEXNEXT_KEYSTORE_BASE64:?Missing HEXNEXT_KEYSTORE_BASE64 release secret}"
          : "${HEXNEXT_STORE_PASSWORD:?Missing HEXNEXT_STORE_PASSWORD release secret}"
          : "${HEXNEXT_KEY_ALIAS:?Missing HEXNEXT_KEY_ALIAS release secret}"
          : "${HEXNEXT_KEY_PASSWORD:?Missing HEXNEXT_KEY_PASSWORD release secret}"
          umask 077
          export HEXNEXT_KEYSTORE_PATH="$RUNNER_TEMP/hexnext-release.keystore"
          trap 'rm -f "$HEXNEXT_KEYSTORE_PATH"' EXIT
          printf '%s' "$HEXNEXT_KEYSTORE_BASE64" | base64 --decode > "$HEXNEXT_KEYSTORE_PATH"
          unset HEXNEXT_KEYSTORE_BASE64
          ./bin/build-and-sign-release-apk.sh
          python3 bin/verify-release-apk.py dist/HexNext_OneUI9_Universal_EN_Signed.apk \
            --expected-version "${GITHUB_REF_NAME#v}" \
            --report dist/HexNext_OneUI9_Universal_EN_Signed.apk.json
          cp android/app/build/outputs/mapping/release/mapping.txt dist/mapping.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HexNext-Universal-Signed-Release
          path: dist/*
          if-no-files-found: error
      - name: Publish verified APK and checksum
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/HexNext_OneUI9_Universal_EN_Signed.apk
            dist/HexNext_OneUI9_Universal_EN_Signed.apk.sha256
            dist/HexNext_OneUI9_Universal_EN_Signed.apk.json
            dist/mapping.txt
