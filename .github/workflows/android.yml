name: Android Universal APK

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Unit tests for the release tooling in bin/ (prepare-release.py, verify-release-apk.py).
  test-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install SDK 36 and build-tools 36.0.0
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # Debug builds carry a few small packs from the `packs` branch (history-free pack hosting),
      # so the test build can theme Settings icons on a private repo without a catalogue download.
      # Release builds never bundle packs (they come from the entitlement server).
      - name: Bundle test packs into the debug build
        run: |
          set -euo pipefail
          git fetch --depth 1 origin packs
          mkdir -p app/src/debug/assets/packs
          for pack in velvet-rope particle-zoo firefly stardust; do
            git show "origin/packs:$pack.zip" > "app/src/debug/assets/packs/$pack.zip"
          done
          ls -l app/src/debug/assets/packs
      - name: Test and build unsigned universal candidate
        run: ./gradlew --no-daemon --console=plain :app:verifyAndroidSdkTools :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug
      - name: Verify installable universal candidate
        run: |
          python3 ../bin/verify-release-apk.py \
            app/build/outputs/apk/release/app-universal-release-unsigned.apk --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: HexNext-Universal-Unsigned-Candidate
          path: |
            android/app/build/outputs/apk/release/app-universal-release-unsigned.apk
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error

      - name: Upload installable debug-signed test build
        uses: actions/upload-artifact@v4
        with:
          name: HexNext-Debug-Test-Installable
          path: android/app/build/outputs/apk/debug/app-universal-debug.apk
          if-no-files-found: error

      - name: Exercise signed release path with an ephemeral CI-only key
        env:
          HEXNEXT_STORE_PASSWORD: ci-test-only
          HEXNEXT_KEY_ALIAS: ci-test
          HEXNEXT_KEY_PASSWORD: ci-test-only
        run: |
          set -euo pipefail
          export HEXNEXT_KEYSTORE_PATH="$RUNNER_TEMP/hexnext-ci-test.keystore"
          trap 'rm -f "$HEXNEXT_KEYSTORE_PATH"' EXIT
          keytool -genkeypair -keystore "$HEXNEXT_KEYSTORE_PATH" \
            -storepass:env HEXNEXT_STORE_PASSWORD -keypass:env HEXNEXT_KEY_PASSWORD \
            -alias "$HEXNEXT_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=HexNext CI Test"
          ../bin/build-and-sign-release-apk.sh "$RUNNER_TEMP/HexNext-ci-test.apk"
