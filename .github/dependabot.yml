version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    ignore:
      # hiddenapibypass 6.2+ needs compileSdk 37; the app compiles against 36 until the toolchain upgrade.
      - dependency-name: org.lsposed.hiddenapibypass:hiddenapibypass
        versions: [">= 6.2"]
      # AGP 9, Gradle 9 and Kotlin/Compose plugin bumps go together in one planned toolchain upgrade.
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
      # Kotlin and its Compose compiler plugin must share one version, so they move together by hand.
      # (Narrow patterns: org.jetbrains.kotlinx libraries keep getting updates.)
      - dependency-name: org.jetbrains.kotlin.*
      - dependency-name: "org.jetbrains.kotlin:*"
      # kotlin("jvm") and kotlin("plugin.serialization") show up under their short ids.
      - dependency-name: jvm
      - dependency-name: plugin.serialization
      # Newer kotlinx-serialization needs a newer Kotlin; it moves with the toolchain upgrade.
      - dependency-name: org.jetbrains.kotlinx:kotlinx-serialization*
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Play Billing majors change the purchase path; each one gets its own tested change.
      - dependency-name: com.android.billingclient:billing
        update-types: [version-update:semver-major]
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
